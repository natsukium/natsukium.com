name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build:
    name: Code standards & build
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: natsukium
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: "Lint and format"
        run: nix flake check
      - name: "Install dependencies"
        run: nix develop --command bash -c "pnpm install --frozen-lockfile"
      - name: "Run tests"
        run: nix develop --command bash -c "pnpm run test"
      - name: "Build the project"
        run: nix develop --command bash -c "pnpm run build"

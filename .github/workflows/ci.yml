name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build:
    name: Code standards & build
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: natsukium
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: "Lint and format"
        run: nix flake check
      - name: "Install dependencies"
        run: nix develop --command bash -c "pnpm install --frozen-lockfile"
      - name: "Run tests"
        run: nix develop --command bash -c "pnpm run test"
      - name: "Build the project"
        run: nix develop --command bash -c "pnpm run build"
